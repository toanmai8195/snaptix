name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.affected.outputs.server }}
      app: ${{ steps.affected.outputs.app }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: base
        name: Commit gốc để so sánh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: echo "sha=${PR_BASE:-$PUSH_BEFORE}" >> "$GITHUB_OUTPUT"
      - id: affected
        name: Vùng bị ảnh hưởng
        run: scripts/ci/affected.sh "${{ steps.base.outputs.sha }}" | tee -a "$GITHUB_OUTPUT"

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/run.sh repo

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: com/tm/server/go.mod
          cache-dependency-path: com/tm/server/go.mod
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: scripts/ci/run.sh server "${{ needs.changes.outputs.base }}"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: com/tm/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: com/tm/app/pnpm-lock.yaml
      - run: scripts/ci/run.sh app "${{ needs.changes.outputs.base }}"
