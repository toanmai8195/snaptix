global:
  scrape_interval: 5s

scrape_configs:
  # Metric app gửi qua OTLP, collector expose lại cho Prometheus
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Service expose /metrics trực tiếp (core, bff) — chạy trên máy host khi dev
  - job_name: services
    static_configs:
      - targets: ["host.docker.internal:8080", "host.docker.internal:3000"]
        labels:
          env: local
