# Hạ tầng local cho snaptix.
#
#   docker compose -f deploy/docker-compose.yml up -d --wait
#   docker compose -f deploy/docker-compose.yml down        # giữ dữ liệu
#   docker compose -f deploy/docker-compose.yml down -v     # xoá cả dữ liệu
#
# Cổng host: xem com/tm/docs/technical/local-setup.md
name: snaptix

x-pg-env: &pg-env
  POSTGRES_USER: ${PG_USER:-snaptix}
  POSTGRES_PASSWORD: ${PG_PASSWORD:-snaptix}

x-pg-healthcheck: &pg-healthcheck
  interval: 3s
  timeout: 3s
  retries: 20

services:
  # ---------------------------------------------------------------------------
  # Kho dữ liệu
  # ---------------------------------------------------------------------------
  postgres-core:
    image: postgres:17-alpine
    environment:
      <<: *pg-env
      POSTGRES_DB: core
    ports: ["5432:5432"]
    volumes: [pg-core:/var/lib/postgresql/data]
    healthcheck:
      <<: *pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d core"]

  postgres-analytics:
    image: postgres:17-alpine
    environment:
      <<: *pg-env
      POSTGRES_DB: analytics
    ports: ["5433:5432"]
    volumes: [pg-analytics:/var/lib/postgresql/data]
    healthcheck:
      <<: *pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d analytics"]

  mongodb:
    image: mongo:8.0
    ports: ["27017:27017"]
    volumes: [mongo:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Observability: app → otel-collector → Tempo (trace) / Prometheus (metric) → Grafana
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # health check
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    ports: ["3100:3000"]
    depends_on: [prometheus, tempo]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pg-core:
  pg-analytics:
  mongo:
  redis:
  tempo:
  prometheus:
  grafana:
